<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Necha vaqt o‘tdi?</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3f1; --card:#ffffff; --ink:#14302b; --muted:#5d7873; --accent:#0f766e; --accent-ink:#ffffff; --line:#d3e0dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e1a18;--card:#152522;--ink:#e6f2ef;--muted:#8fb0aa;--accent:#2dd4bf;--accent-ink:#06201c;--line:#26403b;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e1a18;--card:#152522;--ink:#e6f2ef;--muted:#8fb0aa;--accent:#2dd4bf;--accent-ink:#06201c;--line:#26403b;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.1;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 28px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=date]{flex:1 1 200px;min-width:0;font:inherit;font-family:system-ui,sans-serif;padding:14px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:inherit;font-family:system-ui,sans-serif;font-weight:600;padding:14px 22px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#err{color:#b42318;font-family:system-ui,sans-serif;min-height:1.4em;margin:10px 0 0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #err{color:#ff8a80}}
#out{display:none;margin-top:20px}
.big{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px 20px}
.big p{margin:0 0 14px;color:var(--muted)}
.ymd{display:flex;gap:18px;flex-wrap:wrap}
.ymd div{min-width:84px}
.ymd b{display:block;font-size:clamp(2.4rem,11vw,3.6rem);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.ymd span{font-family:system-ui,sans-serif;color:var(--muted)}
.list{margin:18px 0 0;padding:0;list-style:none;font-family:system-ui,sans-serif}
.list li{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list b{font-variant-numeric:tabular-nums;text-align:right}
.next{margin-top:16px;font-family:system-ui,sans-serif;color:var(--muted)}
.next strong{color:var(--ink)}
.top{display:flex;justify-content:flex-end;margin-bottom:12px}
button.theme{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:8px 14px;font-weight:500;font-size:.9rem}
</style>
</head>
<body>
<main>
  <div class="top"><button type="button" class="theme" id="theme" aria-label="Mavzuni almashtirish">🌙 Tungi rejim</button></div>
  <h1>Tug‘ilganingizdan beri necha vaqt o‘tdi?</h1>
  <p class="sub">Tug‘ilgan kuningizni kiriting — yosh, oy, kun va soniyalargacha hisoblab beraman.</p>

  <div class="row">
    <input type="date" id="dob" aria-label="Tug‘ilgan kun">
    <button id="go" type="button">Hisoblash</button>
  </div>
  <p id="err" role="alert"></p>

  <section id="out" aria-live="polite">
    <div class="big">
      <p>Siz bu dunyoda:</p>
      <div class="ymd">
        <div><b id="y">0</b><span>yil</span></div>
        <div><b id="m">0</b><span>oy</span></div>
        <div><b id="d">0</b><span>kun</span></div>
      </div>
      <ul class="list">
        <li><span>Jami oylar</span><b id="tm"></b></li>
        <li><span>Jami haftalar</span><b id="tw"></b></li>
        <li><span>Jami kunlar</span><b id="td"></b></li>
        <li><span>Jami soatlar</span><b id="th"></b></li>
        <li><span>Jami daqiqalar</span><b id="tmin"></b></li>
        <li><span>Jami soniyalar</span><b id="ts"></b></li>
      </ul>
    </div>
    <p class="next" id="next"></p>
  </section>
</main>

<script>
(function(){
  var dobEl=document.getElementById('dob'), err=document.getElementById('err'), out=document.getElementById('out');
  var birth=null, timer=null;
  var fmt=new Intl.NumberFormat('uz-UZ');
  function $(id){return document.getElementById(id)}
  function f(n){return fmt.format(Math.floor(n)).replace(/\u00a0/g,' ')}

  function diffYMD(a,b){
    var y=b.getFullYear()-a.getFullYear(), m=b.getMonth()-a.getMonth(), d=b.getDate()-a.getDate();
    if(d<0){ m--; d+=new Date(b.getFullYear(),b.getMonth(),0).getDate(); }
    if(m<0){ y--; m+=12; }
    return {y:y,m:m,d:d};
  }
  function nextBirthday(a,now){
    var y=now.getFullYear();
    function mk(yr){
      var dt=new Date(yr,a.getMonth(),a.getDate());
      if(dt.getMonth()!==a.getMonth()) dt=new Date(yr,a.getMonth()+1,1); // 29-fevral
      return dt;
    }
    var n=mk(y);
    var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if(n<today) n=mk(y+1);
    return {date:n,days:Math.round((n-today)/86400000)};
  }
  function render(){
    var now=new Date(), ms=now-birth;
    var r=diffYMD(birth,now);
    $('y').textContent=r.y; $('m').textContent=r.m; $('d').textContent=r.d;
    $('tm').textContent=f(r.y*12+r.m);
    $('tw').textContent=f(ms/604800000);
    $('td').textContent=f(ms/86400000);
    $('th').textContent=f(ms/3600000);
    $('tmin').textContent=f(ms/60000);
    $('ts').textContent=f(ms/1000);
    var nb=nextBirthday(birth,now);
    $('next').innerHTML = nb.days===0
      ? '<strong>Bugun tug‘ilgan kuningiz — tabriklayman! 🎉</strong>'
      : 'Keyingi tug‘ilgan kuningizgacha <strong>'+f(nb.days)+' kun</strong> qoldi.';
  }
  function go(){
    err.textContent='';
    if(!dobEl.value){err.textContent='Iltimos, tug‘ilgan kuningizni tanlang.';return}
    var p=dobEl.value.split('-');
    var d=new Date(+p[0],+p[1]-1,+p[2]);
    if(d>new Date()){err.textContent='Tug‘ilgan kun kelajakda bo‘lishi mumkin emas.';out.style.display='none';return}
    birth=d;
    try{localStorage.setItem('dob',dobEl.value)}catch(e){}
    out.style.display='block';
    render();
    clearInterval(timer);
    timer=setInterval(render,1000);
  }
  var root=document.documentElement, tbtn=$('theme');
  function isDark(){
    var t=root.getAttribute('data-theme');
    if(t) return t==='dark';
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function paintBtn(){tbtn.textContent=isDark()?'☀️ Kunduzgi rejim':'🌙 Tungi rejim'}
  try{var st=localStorage.getItem('theme'); if(st==='dark'||st==='light') root.setAttribute('data-theme',st);}catch(e){}
  paintBtn();
  tbtn.addEventListener('click',function(){
    var next=isDark()?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next)}catch(e){}
    paintBtn();
  });

  $('go').addEventListener('click',go);
  dobEl.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  dobEl.max=new Date().toISOString().slice(0,10);
  try{var s=localStorage.getItem('dob'); if(s){dobEl.value=s; go();}}catch(e){}
})();
</script>
</body>
</html>
